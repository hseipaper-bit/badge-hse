<script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPi7vuryPT7vO_dm3uN_lzEAz6jo4jee3PFwP7p0ACeo57jJ6IOfjxVM55Mpsl8dIT9z6AFK25Vzae/pub?gid=735833020&single=true&output=csv";

    function getParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Convertisseur universel d'URL Google Drive pour affichage <img>
    function formatDriveImageUrl(url) {
      if (!url || url.trim() === "" || url === "N/A") {
        return "https://via.placeholder.com/120?text=Pas+de+Photo";
      }

      let fileId = "";

      // Extraction de l'ID Google Drive depuis plusieurs formats possibles
      const matchId = url.match(/id=([a-zA-Z0-9_-]+)/);
      const matchPath = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      const matchUc = url.match(/uc\?id=([a-zA-Z0-9_-]+)/);

      if (matchId && matchId[1]) fileId = matchId[1];
      else if (matchPath && matchPath[1]) fileId = matchPath[1];
      else if (matchUc && matchUc[1]) fileId = matchUc[1];

      if (fileId) {
        // Format direct haute compatibilité
        return "https://lh3.googleusercontent.com/d/" + fileId;
      }

      return url;
    }

    function parseDate(dateStr) {
      if (!dateStr || dateStr === "N/A" || dateStr.trim() === "") return null;
      const parts = dateStr.split(/[\/\.-]/);
      if (parts.length < 3) return null;
      return new Date(parts[2], parts[1] - 1, parts[0]);
    }

    function verifierDoc(dateStr, nomDocument, motifsArray) {
      if (!dateStr || dateStr.trim() === "" || dateStr === "N/A") return;
      const dateObj = parseDate(dateStr);
      if (!dateObj) return;

      const aujourdhui = new Date();
      aujourdhui.setHours(0, 0, 0, 0);

      if (dateObj < aujourdhui) {
        motifsArray.push(`${nomDocument} expiré(e) (${dateStr})`);
      }
    }

    function verifierInduction(dateStr, motifsArray) {
      if (!dateStr || dateStr.trim() === "" || dateStr === "N/A") return;
      const dateObj = parseDate(dateStr);
      if (!dateObj) return;

      const dateExpiration = new Date(dateObj);
      dateExpiration.setDate(dateExpiration.getDate() + 365);

      const aujourdhui = new Date();
      aujourdhui.setHours(0, 0, 0, 0);

      if (aujourdhui > dateExpiration) {
        motifsArray.push(`Induction/Formation Site expirée (Valide 1 an depuis le ${dateStr})`);
      }
    }

    const idRecherche = getParam('id');

    if (!idRecherche) {
      document.getElementById('result').innerHTML = `
        <div class="status-badge status-error">ÉCHEC DU SCAN</div>
        <h1 style="color:#b91c1c;">❌ ACCÈS NON AUTORISÉ</h1>
        <p>Aucun identifiant de badge fourni.</p>
      `;
    } else {
      fetch(csvUrl)
        .then(response => response.text())
        .then(data => {
          const rows = data.split('\n');
          let trouve = false;
          let rowData = null;

          for (let i = 0; i < rows.length; i++) {
            const cols = rows[i].split(',').map(c => c.trim().replace(/"/g, ''));
            if (cols.includes(idRecherche.trim())) {
              trouve = true;
              rowData = cols;
              break;
            }
          }

          if (trouve) {
            const societe       = rowData[2]  || "N/A"; 
            const nomPrenom     = rowData[3]  || "N/A"; 
            const photoRaw      = rowData[4]  || "";    

            const expAssuranceRC      = rowData[5]  || "";
            const expAssuranceAT_Phys = rowData[7]  || "";
            const expHabElectrique    = rowData[9]  || "";
            const expHabHauteur       = rowData[11] || "";
            const expCACES            = rowData[13] || "";
            const expTravailChaud     = rowData[15] || "";
            const dateInductionSite   = rowData[17] || ""; 

            const photoUrl = formatDriveImageUrl(photoRaw);
            const motifsRefus = [];

            verifierDoc(expAssuranceRC, "Assurance RC", motifsRefus);
            verifierDoc(expAssuranceAT_Phys, "Assurance AT / Aptitude Physique", motifsRefus);
            verifierDoc(expHabElectrique, "Habilitation Électrique", motifsRefus);
            verifierDoc(expHabHauteur, "Habilitation Travail en Hauteur", motifsRefus);
            verifierDoc(expCACES, "CACES / Engins", motifsRefus);
            verifierDoc(expTravailChaud, "Certificat Travail à Chaud", motifsRefus);
            verifierInduction(dateInductionSite, motifsRefus);

            const estConforme = motifsRefus.length === 0;

            if (estConforme) {
              document.getElementById('result').innerHTML = `
                <div class="status-badge status-ok">CONFORMITÉ HSE VALIDÉE</div>
                <h1 style="color:#15803d;">✔ ACCÈS AUTORISÉ</h1>

                <img src="${photoUrl}" alt="Photo de profil" class="profile-photo" crossorigin="anonymous" onerror="this.onerror=null; this.src='https://via.placeholder.com/120?text=Photo+N/A';" />

                <div class="info-group">
                  <div class="info-item"><span class="label">ID Badge :</span><span class="value">${idRecherche}</span></div>
                  <div class="info-item"><span class="label">Nom & Prénom :</span><span class="value">${nomPrenom}</span></div>
                  <div class="info-item"><span class="label">Société :</span><span class="value">${societe}</span></div>
                  <div class="info-item"><span class="label">Date Induction :</span><span class="value">${dateInductionSite || "N/A"}</span></div>
                  <div class="info-item"><span class="label">Habilitations & Doc :</span><span class="value" style="color:#15803d;">À JOUR</span></div>
                </div>
              `;
            } else {
              let listeHtml = motifsRefus.map(m => `<li>${m}</li>`).join('');

              document.getElementById('result').innerHTML = `
                <div class="status-badge status-error">HABILITATION OU DOC EXPIRÉ</div>
                <h1 style="color:#b91c1c;">❌ ACCÈS REFUSÉ</h1>

                <img src="${photoUrl}" alt="Photo de profil" class="profile-photo" style="border-color:#b91c1c;" crossorigin="anonymous" onerror="this.onerror=null; this.src='https://via.placeholder.com/120?text=Photo+N/A';" />

                <div class="info-group">
                  <div class="info-item"><span class="label">ID Badge :</span><span class="value">${idRecherche}</span></div>
                  <div class="info-item"><span class="label">Nom & Prénom :</span><span class="value">${nomPrenom}</span></div>
                  <div class="info-item"><span class="label">Société :</span><span class="value">${societe}</span></div>
                  <div class="info-item"><span class="label">Statut :</span><span class="value" style="color:#b91c1c;">NON CONFORME</span></div>
                </div>

                <div class="motifs-box">
                  <div class="motifs-title">⚠️ Document(s) / Habilitation(s) non conforme(s) :</div>
                  <ul class="motifs-list">
                    ${listeHtml}
                  </ul>
                </div>
              `;
            }
          } else {
            document.getElementById('result').innerHTML = `
              <div class="status-badge status-error">BADGE INCONNU</div>
              <h1 style="color:#b91c1c;">❌ ACCÈS NON AUTORISÉ</h1>
              <p>Le badge <b>${idRecherche}</b> n'est pas enregistré dans la base de données.</p>
            `;
          }
        })
        .catch(error => {
          document.getElementById('result').innerHTML = `
            <div class="status-badge status-error">ERREUR SYSTÈME</div>
            <h1 style="color:#b91c1c;">Erreur</h1>
            <p>Impossible de vérifier l'état du badge.</p>
          `;
        });
    }
  </script>
